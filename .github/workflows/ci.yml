name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:mobile
      # timing-sensitive; runs on the shared runner for regressions in CPU cost, not frame time
      - run: npm run test:perf
      # the site is published by pushing the built dist to the gh-pages branch, which is what
      # Pages serves; this job only proves the build still compiles
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore
