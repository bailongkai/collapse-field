name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:mobile
      # timing-sensitive; runs on the shared runner for regressions in CPU cost, not frame time
      - run: npm run test:perf
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # publishes the built game to GitHub Pages; enable Pages with "GitHub Actions" as the source
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
